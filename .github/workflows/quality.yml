name: Quality
on:
  push:
    branches: ["main"]
  pull_request:
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm data:validate
      - run: pnpm evidence:validate
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm build
