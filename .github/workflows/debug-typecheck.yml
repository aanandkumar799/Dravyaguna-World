name: Debug Typecheck

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pnpm
        run: npm install --global pnpm@10.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Capture typecheck output
        id: check
        run: |
          set +e
          pnpm typecheck > typecheck-debug.txt 2>&1
          pnpm test > test-debug.txt 2>&1
          status=$?
          echo "status=$status" >> test-debug.txt
          exit 0
      - name: Commit diagnostic
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add typecheck-debug.txt test-debug.txt
          git commit -m "chore: capture typecheck diagnostics" || true
          git push
