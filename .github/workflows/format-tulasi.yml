name: Format Tulasi data
on:
  push:
    paths:
      - ".github/workflows/format-tulasi.yml"
permissions:
  contents: write
jobs:
  format:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm install --global pnpm@10.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write data/plants/tulasi.json
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/plants/tulasi.json
          git diff --cached --quiet && exit 0
          git commit -m "style: format Tulasi plant data"
          git push
